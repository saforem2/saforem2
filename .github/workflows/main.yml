name: Metrics
on:
  # Schedule updates (each day)
  schedule: [{cron: "0 0 * * *"}]
  # Lines below let you run workflow manually and on each commit (optional)
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:

  snakemake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  personal-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🦑 Personal metrics
        # See action.yml for all options
        uses: lowlighter/metrics@latest
        with:
            # Your GitHub token
            token: ${{ secrets.METRICS_TOKEN }}
            # Options
            user: saforem2
            template: classic
            base: header, activity, community, repositories, metadata, habits
            base_indepth: yes
            config_display: columns
            config_timezone: America/Chicago
            config_twemoji: yes
            commits_authoring: saforem2
            # config_presets: @ocean-blue
            # config_octicon: yes
            # Achievements — currently broken upstream: GitHub removed the Projects (classic)
            # GraphQL field and the achievements query includes it, so it returns user:null.
            # Workaround: limit to badges that don't need that path, or re-enable after
            # https://github.com/lowlighter/metrics/issues/1834 is merged.
            plugin_achievements: no
            plugin_achievements_display: detailed
            plugin_achievements_secrets: yes
            # Note: activity/habits can show "Unexpected error" if the upstream query returns
            # null commit payloads. Disabling achievements (above) fixes the shared null on most
            # recent lowlighter/metrics builds; if they persist, see lowlighter/metrics#1834.
            plugin_activity: yes
            plugin_activity_days: 14
            plugin_activity_filter: all
            plugin_activity_limit: 10
            plugin_activity_visibility: all
            plugin_calendar: yes
            plugin_calendar_limit: 4
            plugin_code: yes
            plugin_code_days: 3
            plugin_code_lines: 12
            plugin_code_load: 400
            plugin_code_visibility: public
            # plugin_discussions: yes
            # plugin_discussions_categories: yes
            plugin_followup: yes
            plugin_followup_archived: yes
            plugin_followup_sections: repositories
            plugin_gists: yes
            plugin_habits: yes
            plugin_habits_charts_type: classic
            plugin_habits_days: 14
            plugin_habits_facts: yes
            plugin_habits_from: 200
            plugin_habits_languages_limit: 8
            plugin_habits_languages_threshold: 0%
            plugin_introduction: yes
            plugin_introduction_title: yes
            plugin_isocalendar: yes
            plugin_isocalendar_duration: full-year
            plugin_languages: yes
            plugin_languages_analysis_timeout: 60
            plugin_languages_categories: markup, programming
            plugin_languages_colors: github
            plugin_languages_indepth: yes
            plugin_languages_limit: 8
            plugin_languages_recent_categories: markup, programming
            plugin_languages_recent_days: 14
            plugin_languages_recent_load: 300
            plugin_languages_sections: most-used
            plugin_languages_threshold: 0%
            plugin_lines: yes
            plugin_lines_history_limit: 1
            plugin_lines_repositories_limit: 4
            plugin_lines_sections: base
            
            plugin_music: yes
            plugin_music_limit: 10
            plugin_music_mode: recent
            plugin_music_played_at: yes
            plugin_music_provider: lastfm
            plugin_music_time_range: medium
            plugin_music_top_type: tracks
            plugin_music_user: saforem2
            plugin_music_token: ${{ secrets.LASTFM_API_KEY }}
            # plugin_music_provider: spotify
            # plugin_music_time_range: short
            # plugin_music_top_type: tracks
            # plugin_music_user: saforem2
            # plugin_music_provider: lastfm  # Use Last.fm as provider
            # plugin_music_mode: recent      # Set plugin mode
            # plugin_music_limit: 4          # Limit to 4 entries
            # plugin_music_user: saforem2 # Use same username as GitHub login
            plugin_notable: yes
            plugin_notable_from: organization
            plugin_notable_self: yes
            plugin_notable_types: commit
            # PageSpeed — disabled: the shared lowlighter quota (project 583797351490) returns 429.
            # To re-enable, create a PageSpeed API key (https://developers.google.com/speed/docs/insights/v5/get-started)
            # and add it as a repo secret, then set:
            #   plugin_pagespeed: yes
            #   plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
            #   plugin_pagespeed_url: https://samf.sh
            plugin_pagespeed: no
            plugin_people: yes
            plugin_people_limit: 24
            plugin_people_size: 28
            plugin_people_types: followers, following
            # Projects (classic) — GitHub removed the classic Projects GraphQL field (May 2024 sunset).
            # Re-enable when lowlighter/metrics migrates to Projects v2 (see lowlighter/metrics#1834).
            plugin_projects: no
            plugin_reactions: yes
            plugin_reactions_display: absolute
            plugin_reactions_limit: 200
            plugin_reactions_limit_discussions: 100
            plugin_reactions_limit_discussions_comments: 100
            plugin_reactions_limit_issues: 100
            plugin_repositories: yes
            plugin_repositories_order: pinned, starred, random
            plugin_repositories_featured: saforem2/ezpz, saforem2/l2hmc-qcd, saforem2/samf.sh, saforem2/torchtitan
            plugin_rss: yes
            plugin_rss_limit: 4
            plugin_rss_source: https://samf.sh/rss.xml
            # Skyline — skyline.github.com was taken down; puppeteer times out after 90s.
            plugin_skyline: no
            # plugin_skyline_settings: {
            #   "url": "https://skyline.github.com/${login}/${year}",
            #   "ready": "[...document.querySelectorAll('span')].map(span => span.innerText).includes('Share on Twitter')",
            #   "wait": 1,
            #   "hide": "button, footer, a"
            # }
            # plugin_skyline_year: current-year
            # plugin_screenshot: yes
            # plugin_screenshot_background: yes
            # plugin_screenshot_selector: body
            # plugin_screenshot_title: My Website
            # plugin_screenshot_url: https://samforeman.me
            # plugin_sponsors: yes
            # plugin_sponsors_sections: goal, list, about
            # plugin_sponsors_size: 24
            # plugin_sponsors_title: Sponsor Me!
            plugin_stargazers: yes
            plugin_stargazers_charts: yes
            plugin_stargazers_charts_type: chartist
            # Stargazers worldmap — requires GOOGLE_MAPS_TOKEN / plugin_stargazers_token (not configured).
            plugin_stargazers_worldmap: no
            plugin_starlists: yes
            plugin_starlists_limit: 2
            plugin_starlists_limit_languages: 8
            plugin_starlists_limit_repositories: 2
            plugin_starlists_shuffle_repositories: yes
            plugin_stars: yes
            plugin_stars_limit: 4
            # Support — community forum account no longer exists.
            plugin_support: no
            plugin_topics: yes
            plugin_topics_limit: 15
            plugin_topics_mode: starred
            plugin_topics_sort: stars
            # Traffic — requires a PAT with repo scope that includes traffic visibility; METRICS_TOKEN lacks it.
            plugin_traffic: no
            # Tweets — deprecated upstream (Twitter removed free API access in 2023).
            plugin_tweets: no
            # WakaTime — WAKATIME_TOKEN is an API key; the plugin now requires an OAuth token
            # (https://wakatime.com/oauth). Disabled until the secret is rotated.
            plugin_wakatime: no
            repositories_batch: 500
            repositories_forks: yes
            plugin_activity_timestamps: yes
            plugin_languages_ignored: Jupyter Notebook, html, css, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
            plugin_languages_details: lines, bytes-size
            plugin_achievements_only: polyglot, stargazer, sponsor, deployer, member, maintainer, developer, scripter, packager, explorer, infographile, manager
            plugin_habits_charts: yes
            plugins_errors_fatal: ${{ github.repository == 'lowlighter/lowlighter' }}
            plugin_notable_indepth: yes
            plugin_notable_repositories: yes
            plugin_projects_repositories: lowlighter/metrics/projects/1
            plugin_projects_descriptions: yes
